name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build (Tycho)
        run: mvn -B -ntp clean verify
      - name: Upload p2 update site
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: com.kcube.mavenview.update-site/target/com.kcube.mavenview.update-site-*.zip
